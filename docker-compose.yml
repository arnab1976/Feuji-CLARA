services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crosssell}
      POSTGRES_USER: ${POSTGRES_USER:-crosssell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crosssell}
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crosssell}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             gunicorn crosssell.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 180"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-crosssell}
      POSTGRES_USER: ${POSTGRES_USER:-crosssell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crosssell}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      DJANGO_DEBUG: "0"
    volumes:
      - ./data:/data:ro
    ports:
      - "8000:8000"
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "5180:80"
    depends_on:
      - backend

volumes:
  pgdata:
